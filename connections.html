
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discover — The Music Atlas</title>

  <!-- APPLY SAVED THEME BEFORE PAGE LOAD -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("music-atlas-theme");

      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      document.documentElement.dataset.theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : prefersDark ? "dark" : "light";
    })();
  </script>

  <link rel="stylesheet" href="connections.css">

  <script src="connections.js" defer></script>
  <script src="theme.js" defer></script>
</head>

<body>

  <!-- ========================================
       NAVIGATION
  ========================================= -->

  <header class="site-header">

    <nav class="navigation" aria-label="Main navigation">

      <a href="index.html" class="brand">
        THE MUSIC ATLAS<span>.</span>
      </a>

      <!-- SEARCH — UNCHANGED -->

      <div class="search-group">

        <form
          class="nav-search"
          id="discovery-search"
          role="search"
        >

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="10.8" cy="10.8" r="7"></circle>
            <path d="m16 16 5 5"></path>
          </svg>

          <label class="sr-only" for="artist-search">
            Search an artist
          </label>

          <input
            type="search"
            id="artist-search"
            placeholder="Search an artist"
            autocomplete="off"
            required
          >

          <button
            type="submit"
            aria-label="Submit artist search"
          >
            →
          </button>

        </form>

        <span class="search-caption">
          FOLLOW YOUR CURIOSITY
        </span>

      </div>

      <!-- LIGHT / DARK THEME BUTTON -->

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      >

        <svg
          class="theme-svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <!-- SUN -->

          <circle
            class="sun-core"
            cx="12"
            cy="12"
            r="4"
          ></circle>

          <path
            class="sun-rays"
            d="M12 2v2
               M12 20v2
               M4.93 4.93l1.42 1.42
               M17.65 17.65l1.42 1.42
               M2 12h2
               M20 12h2
               M4.93 19.07l1.42-1.42
               M17.65 6.35l1.42-1.42"
          ></path>

          <!-- MOON -->

          <path
            class="moon-shape"
            d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5
               8.5 8.5 0 1 0 20.5 14.5Z"
          ></path>

        </svg>

      </button>

    </nav>

  </header>


  <!-- ========================================
       MAIN DISCOVERY CONTENT
  ========================================= -->

  <main class="discovery">

    <div class="discovery-layout">

      <!-- ARTIST PROFILE -->

      <section
        class="artist-intro"
        aria-labelledby="artist-name"
      >

        <div class="portrait-frame">

          <div
            class="portrait-fallback"
            id="portrait-fallback"
          >
            THE MUSIC<br>ATLAS<span>.</span>
          </div>

          <img
            id="artist-photo"
            alt=""
            hidden
          >

        </div>

        <div class="artist-copy">

          <p class="eyebrow" id="artist-genre"></p>

          <h1 id="artist-name"></h1>

          <p class="artist-bio" id="artist-bio"></p>

        </div>

      </section>


      <!-- DISCOVERY CONTENT -->

      <div class="discovery-content">

        <!-- ESSENTIAL ALBUMS -->

        <section
          class="albums-section"
          aria-labelledby="albums-heading"
        >

          <div class="section-header">
            <h2 id="albums-heading">
              Three essential albums<span class="blue-dot">.</span>
            </h2>
          </div>

          <div class="albums-grid" id="albums"></div>

        </section>


        <!-- ARTIST CONNECTIONS -->

        <section
          class="connections-section"
          aria-labelledby="connections-heading"
        >

          <div class="section-header">
            <h2 id="connections-heading">
              Follow the sound<span class="blue-dot">.</span>
            </h2>
          </div>

          <div
            class="connections-grid"
            id="connections-grid"
          ></div>

        </section>

      </div>

    </div>


    <!-- ========================================
         DISCOVERY TRAIL
    ========================================= -->

    <footer class="discovery-footer">

      <span class="eyebrow">
        YOUR DISCOVERY TRAIL
      </span>

      <nav
        class="discovery-trail"
        id="discovery-trail"
        aria-label="Discovery trail"
      ></nav>

      <button
        type="button"
        id="reset-trail"
        class="reset-trail"
      >
        Start over
      </button>

    </footer>

  </main>

</body>
</html>
