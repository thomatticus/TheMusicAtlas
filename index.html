
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Music Atlas | Discover Music</title>

  <!-- APPLY SAVED THEME BEFORE PAGE LOAD -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("music-atlas-theme");

      const prefersDark = window.matchMedia(
        "(prefers-color-scheme: dark)"
      ).matches;

      document.documentElement.dataset.theme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : prefersDark ? "dark" : "light";
    })();
  </script>

  <link rel="stylesheet" href="style.css">

  <script src="script.js" defer></script>
  <script src="theme.js" defer></script>
</head>

<body>

  <!-- ========================================
       NAVIGATION
  ========================================= -->

  <header class="site-header">

    <nav class="navigation" aria-label="Main navigation">

      <a href="#home" class="brand" id="home-link">
        THE MUSIC ATLAS<span>.</span>
      </a>

      <!-- SEARCH — UNCHANGED -->

      <div class="search-group">

        <form
          class="nav-search"
          id="search-form"
          role="search"
        >

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="10.8" cy="10.8" r="7"></circle>
            <path d="m16 16 5 5"></path>
          </svg>

          <label class="sr-only" for="artist-search">
            Search an artist
          </label>

          <input
            type="search"
            id="artist-search"
            placeholder="Search an artist"
            autocomplete="off"
            required
          >

          <button
            type="submit"
            aria-label="Submit artist search"
          >
            <span aria-hidden="true">→</span>
          </button>

        </form>

        <span class="search-caption">
          Follow your curiosity
        </span>

      </div>

      <!-- LIGHT / DARK THEME BUTTON -->

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to dark mode"
        title="Switch to dark mode"
      >

        <svg
          class="theme-svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >

          <!-- SUN -->

          <circle
            class="sun-core"
            cx="12"
            cy="12"
            r="4"
          ></circle>

          <path
            class="sun-rays"
            d="M12 2v2
               M12 20v2
               M4.93 4.93l1.42 1.42
               M17.65 17.65l1.42 1.42
               M2 12h2
               M20 12h2
               M4.93 19.07l1.42-1.42
               M17.65 6.35l1.42-1.42"
          ></path>

          <!-- MOON -->

          <path
            class="moon-shape"
            d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5
               8.5 8.5 0 1 0 20.5 14.5Z"
          ></path>

        </svg>

      </button>

    </nav>

  </header>


  <!-- ========================================
       ORIGINAL BLUE WATER RIPPLE
  ========================================= -->

  <div
    class="loading-screen"
    id="loading-screen"
    role="status"
    aria-label="Loading artist information"
    hidden
  >

    <div class="water-ripple" aria-hidden="true">
      <span class="ripple-ring"></span>
      <span class="ripple-ring"></span>
      <span class="ripple-ring"></span>
      <span class="ripple-ring"></span>
      <span class="ripple-ring"></span>
      <span class="ripple-center"></span>
    </div>

  </div>


  <!-- ========================================
       MAIN CONTENT
  ========================================= -->

  <main id="home">

    <!-- HERO -->

    <section
      class="hero"
      aria-labelledby="hero-title"
    >

      <div class="hero-content">

        <h1 id="hero-title">
          Good music leads somewhere
        </h1>

        <p>
          Explore the artists, influences, and connections
          behind the music you love.
        </p>

      </div>

    </section>


    <!-- ========================================
         FEATURED ARTISTS
    ========================================= -->

    <section
      class="featured-artists"
      aria-labelledby="featured-title"
    >

      <div class="featured-container">

        <div class="featured-heading">

          <h2 id="featured-title">
            A little inspiration.
          </h2>

        </div>


        <!-- ARTIST GRID -->

        <div
          class="artist-grid"
          id="artist-grid"
          aria-live="polite"
        ></div>


        <!-- ========================================
             CIRCULAR RESHUFFLE BUTTON
        ========================================= -->

        <div class="featured-footer">

          <button
            class="refresh-artists"
            id="refresh-artists"
            type="button"
            aria-label="Reshuffle artists"
          >

            <svg
              class="reshuffle-art"
              viewBox="0 0 120 120"
              aria-hidden="true"
            >

              <defs>
                <path
                  id="reshuffle-top"
                  d="M 18,60 A 42,42 0 0,1 102,60"
                />

                <path
                  id="reshuffle-bottom"
                  d="M 18,60 A 42,42 0 0,0 102,60"
                />
              </defs>

              <circle
                class="reshuffle-border"
                cx="60"
                cy="60"
                r="58"
              />

              <g class="reshuffle-lettering">

                <text text-anchor="middle">
                  <textPath
                    href="#reshuffle-top"
                    startOffset="50%"
                  >RESHUFFLE</textPath>
                </text>

                <text text-anchor="middle">
                  <textPath
                    href="#reshuffle-bottom"
                    startOffset="50%"
                  >RESHUFFLE</textPath>
                </text>

              </g>

              <circle
                class="reshuffle-center"
                cx="60"
                cy="60"
                r="2.5"
              />

            </svg>

          </button>

        </div>

      </div>

    </section>

  </main>

</body>
</html>
